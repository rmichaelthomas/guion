[package]
name = "guion-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

# Pure cryptography for the `Crypto` instruction. No I/O, no randomness source, no C toolchain:
# this crate must build for wasm32-unknown-unknown, and randomness only ever arrives as an
# argument. Every dependency is pinned exactly and shares one `digest` major version (0.10),
# which is the version `sha2` already used in this workspace.
#
# Compatible set for the later crypto tasks (signature verification only, no private keys; do not mix in a
# newer major of any of them, they would pull a second `digest`/`der`/`spki`):
#   sha2      =0.10.9   digest 0.10
#   sha3      =0.10.8   digest 0.10
#   rsa       =0.9.10   digest 0.10, pkcs8/spki/der 0.7
#   p256      =0.13.2   ecdsa 0.16, digest 0.10, pkcs8/spki/der 0.7
#   x509-cert =0.2.5    der/spki 0.7
#   hkdf      =0.12.4   hmac 0.12, digest 0.10
#   hmac      =0.12.1   digest 0.10
#   chacha20poly1305 =0.10.1, default-features = false (no getrandom), alloc only
#   ark-*     =0.5.0    (bls12-381, ec, ff, serialize) digest 0.10, no `std` feature so no getrandom or rayon
[dependencies]
sha2 = { workspace = true, features = ["oid"] }
sha3.workspace = true
rsa.workspace = true
p256.workspace = true
x509-cert.workspace = true
ark-bls12-381.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
hkdf.workspace = true
hmac.workspace = true
chacha20poly1305.workspace = true
# DAG-CBOR encodes a `serde_json::Value`. The workspace turns on `arbitrary_precision`, so a number keeps
# its source text and integers beyond 64 bits are told apart from floats.
serde_json.workspace = true

# rsa 0.9 has the Marvin timing side channel (RUSTSEC-2023-0071) in private-key operations; this
# crate only verifies signatures with public keys and never decrypts or signs, so it is not reachable.
