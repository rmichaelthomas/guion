[package]
name = "guion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "guion"
path = "src/main.rs"

[features]
default = []
python-interop = ["guion-runtime/python-interop"]

[dependencies]
guion-model.workspace = true
guion-runtime.workspace = true
toml.workspace = true
sha2.workspace = true
libc.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true

[dev-dependencies]
guion-compiler.workspace = true
guion-bootstrap = { path = "../bootstrap" }

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "python_dependencies"
path = "tests/python_dependencies.rs"
required-features = ["python-interop"]

