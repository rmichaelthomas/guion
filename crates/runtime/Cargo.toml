[package]
name = "veritas-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
python-interop = []

[dependencies]
veritas-model.workspace = true
libc.workspace = true
serde_json.workspace = true
serde.workspace = true
base64.workspace = true
reqwest.workspace = true
tokio.workspace = true
hmac.workspace = true
sha2.workspace = true
rusqlite.workspace = true
toml_edit.workspace = true
icu_casemap.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true
cranelift-codegen = "=0.135.0"
cranelift-frontend = "=0.135.0"
cranelift-jit = "=0.135.0"
cranelift-module = "=0.135.0"
cranelift-native = "=0.135.0"

[dev-dependencies]
veritas-compiler.workspace = true

[build-dependencies]
cc = "=1.8.0"
sha2.workspace = true

[[test]]
name = "python_bridge"
path = "tests/python_bridge.rs"
required-features = ["python-interop"]

[[example]]
name = "runtime_lifecycle_stress"
path = "examples/runtime_lifecycle_stress.rs"
required-features = ["python-interop"]

