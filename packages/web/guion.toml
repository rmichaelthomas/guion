[package]
name = "web"
version = "0.1.0"
entry = "src/lib.gu"
exports = ["src/lib.gu", "src/router.gu", "src/middleware.gu", "src/serve.gu", "src/session.gu", "src/csrf.gu", "src/html.gu", "src/static.gu"]

# Capabilities are declared up front so the package system carries them from the first release;
# `guion check` compares them with what the modules actually use once there are modules.
[capabilities]
files = ["read", "write"]
network = ["127.0.0.1"]
clock = true

# `guion test` of this package reads the clock (session expiry); a project that uses the package grants
# the clock itself, in its own guion.toml.
[clock]
enabled = true
