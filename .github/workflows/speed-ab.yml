name: Speed gate A/B on GitHub runners

# Runs the speed gate for a branch and for its merge base with main on the same runner, one
# after the other, so that an engine change is compared on one CPU rather than across the
# varying machines behind each GitHub runner label. Runs on pushes to ab/** branches.
on:
  push:
    branches: ["ab/**"]
  workflow_dispatch:
    inputs:
      trials:
        description: Timed trials per lane
        default: "15"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  speed-ab:
    name: Speed A/B on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install the project Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools
          rustup default 1.97.1
          cargo fetch --locked

      - name: Install CPython 3.14.7
        run: |
          curl -LsSf https://astral.sh/uv/0.13.4/install.sh | sh
          "$HOME/.local/bin/uv" python install 3.14.7
          echo "GATE_PYTHON=$("$HOME/.local/bin/uv" python find 3.14.7)" >> "$GITHUB_ENV"

      - name: Build the profile-guided binaries for the branch and its base
        run: |
          base=$(git merge-base HEAD origin/main)
          echo "BASE_COMMIT=$base" >> "$GITHUB_ENV"
          git worktree add ../base "$base"
          sh distribution/pgo/build.sh target/pgo
          (cd ../base && cargo fetch --locked && sh distribution/pgo/build.sh target/pgo)

      - name: Run the gate for both
        shell: bash
        run: |
          {
            echo "## ${{ matrix.runner }} ($(uname -m), $(nproc) CPUs; $(grep -m1 -E 'model name|CPU part' /proc/cpuinfo))"
            echo "Branch $(git rev-parse --short HEAD) against base $(git rev-parse --short "$BASE_COMMIT")"
          } >> "$GITHUB_STEP_SUMMARY"
          for side in base branch; do
            if [ "$side" = base ]; then guion=../base/target/pgo/guion; else guion=target/pgo/guion; fi
            echo "### $side" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            "$GATE_PYTHON" evaluation/development/core_cost_closure/run_speed_gate.py \
              --guion "$guion" --python "$GATE_PYTHON" \
              --trials "${{ inputs.trials || '15' }}" --output "speed-ab-$side-${{ matrix.runner }}.json" \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Retain the gate reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: speed-ab-${{ matrix.runner }}-${{ github.run_id }}
          path: speed-ab-*.json
          if-no-files-found: warn
          retention-days: 90
