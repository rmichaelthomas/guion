name: Speed gate on GitHub runners

# Measures the Guion/Python speed gate on GitHub's x86_64 and ARM64 Linux runners with the
# profile-guided release build and a PGO+LTO CPython. Shared runners are noisier than the pinned
# container, so these runs are evidence about each architecture, not the gate of record.
# Runs on demand, or when the gate harness itself changes.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Timed trials per lane
        default: "15"
  pull_request:
    paths:
      - .github/workflows/speed-gate.yml
      - evaluation/development/core_cost_closure/run_speed_gate.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  speed-gate:
    name: Speed gate on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install the project Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools
          rustup default 1.97.1
          cargo fetch --locked

      - name: Install CPython 3.14.7
        run: |
          curl -LsSf https://astral.sh/uv/0.13.4/install.sh | sh
          "$HOME/.local/bin/uv" python install 3.14.7
          echo "GATE_PYTHON=$("$HOME/.local/bin/uv" python find 3.14.7)" >> "$GITHUB_ENV"

      - name: Build the profile-guided release binary
        run: sh distribution/pgo/build.sh target/pgo

      - name: Run the speed gate
        run: |
          {
            echo "## ${{ matrix.runner }} ($(uname -m), $(nproc) CPUs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          "$GATE_PYTHON" evaluation/development/core_cost_closure/run_speed_gate.py \
            --guion target/pgo/guion --python "$GATE_PYTHON" \
            --trials "${{ inputs.trials || '15' }}" --output "speed-gate-${{ matrix.runner }}.json" \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Retain the gate report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: speed-gate-${{ matrix.runner }}-${{ github.run_id }}
          path: speed-gate-${{ matrix.runner }}.json
          if-no-files-found: warn
          retention-days: 90
