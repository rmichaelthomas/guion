name: Profile the speed-gate workloads

# Records hardware counters and hot functions for the gate workloads on GitHub's x86_64 and
# ARM64 Linux runners, to explain where Guion loses ground to Python at 200k rows on server CPUs.
# Runs on demand or on pushes to profile/** branches.
on:
  push:
    branches: ["profile/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Profile on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install the project Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools
          rustup default 1.97.1
          cargo fetch --locked

      - name: Install CPython 3.14.7
        run: |
          curl -LsSf https://astral.sh/uv/0.13.4/install.sh | sh
          "$HOME/.local/bin/uv" python install 3.14.7
          echo "GATE_PYTHON=$("$HOME/.local/bin/uv" python find 3.14.7)" >> "$GITHUB_ENV"

      - name: Install perf
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y linux-tools-common linux-tools-generic
          mkdir -p "$HOME/bin"
          ln -sf "$(ls /usr/lib/linux-tools/*/perf | head -n 1)" "$HOME/bin/perf"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      # Line tables let perf attribute samples to source lines; they do not change the code.
      - name: Build the profile-guided release binary
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: sh distribution/pgo/build.sh target/pgo

      - name: Profile the workloads
        run: |
          echo "CPU: $(grep -m1 -E 'model name|CPU part' /proc/cpuinfo), $(nproc) CPUs"
          "$GATE_PYTHON" evaluation/development/core_cost_closure/profile_gate_workloads.py \
            --guion target/pgo/guion --python "$GATE_PYTHON" --output profile-out

      - name: Retain the profiles
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gate-profile-${{ matrix.runner }}-${{ github.run_id }}
          path: profile-out/
          if-no-files-found: warn
          retention-days: 90
