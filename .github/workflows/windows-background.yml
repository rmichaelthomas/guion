name: Windows background commands

# Runs the one test that checks a background command and everything it started are gone when
# its `together:` block ends, on a standard GitHub-hosted Windows runner. It runs when this file
# changes or when started by hand.
on:
  push:
    branches: [structured-concurrency]
    paths:
      - ".github/workflows/windows-background.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install the project Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version

      - name: Test background commands on Windows
        shell: bash
        run: |
          cargo test --locked -p guion-cli --test concurrency -- windows:: --nocapture
