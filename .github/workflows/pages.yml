name: Publish the Guion site

# Deploys only site/public. In the repository's Pages settings the Source must be "GitHub Actions";
# otherwise Pages serves the whole repository tree from main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy site/public
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Check the site (tests that need Rust or AllHereHTML skip themselves here)
        run: |
          node --test 'site/tests/*.test.mjs'
          node site/tools/check-site.mjs site/public

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload site/public
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
