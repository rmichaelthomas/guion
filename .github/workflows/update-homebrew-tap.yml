name: Update the Homebrew tap

# When a full (non-pre-)release is published, regenerate Formula/guion.rb in
# rmichaelthomas/homebrew-guion from that release's archives and push it. The push uses a deploy
# key that has write access to the tap repository only (secret HOMEBREW_TAP_DEPLOY_KEY).
# Run it by hand with a version to repair or redo a formula.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v, for example 0.5.0
        required: true

permissions:
  contents: read

jobs:
  tap:
    name: Regenerate the formula
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source (for the formula template)
        uses: actions/checkout@v7.0.1

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${INPUT_VERSION:-${TAG#v}}"
          VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected version: $VERSION" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Render the formula from the release's checksums
        run: sh scripts/render-homebrew-formula.sh "${{ steps.version.outputs.version }}" > guion.rb

      - name: Push it to the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set; the rendered formula follows." >&2
            cat guion.rb
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:rmichaelthomas/homebrew-guion.git tap
          mkdir -p tap/Formula
          cp guion.rb tap/Formula/guion.rb
          cd tap
          git config user.name "guion release workflow"
          git config user.email "noreply@github.com"
          if git diff --quiet; then
            echo "formula already up to date"
          else
            git add Formula/guion.rb
            git commit -m "guion ${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi
