[project]
name = "veritas-self-hosting"
version = "0.1.0"
entry = "compiler.vr"

[runtime]
# The compiler's own source is parsed and lowered at bootstrap stages; budget
# those compiler invocations separately from ordinary application programs.
instruction_limit = 500000000
# Self-compilation materializes compiler IR and runs the recursive semantic checker.
allocation_limit_bytes = 8589934592
# Import resolution permits up to 128 levels and retains one compiler frame per level.
call_depth_limit = 160
max_collection_items = 1000000
