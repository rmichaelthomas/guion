[workspace]
resolver = "2"
members = ["crates/model", "crates/compiler", "crates/vm-core", "crates/vm-wasm", "crates/runtime", "crates/cli", "crates/bootstrap", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
guion-model = { path = "crates/model" }
guion-compiler = { path = "crates/compiler" }
guion-runtime = { path = "crates/runtime" }
guion-vm-core = { path = "crates/vm-core" }
toml = "=1.1.8"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
serde = "=1.0.229"
sha2 = "=0.10.9"
hmac = "=0.12.1"
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled", "hooks"] }
toml_edit = "=0.25.13"
icu_casemap = "=2.4.0"
icu_normalizer = "=2.4.0"
icu_properties = "=2.4.0"
libc = "=0.2.189"
base64 = "=0.22.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "time", "net", "macros"] }

